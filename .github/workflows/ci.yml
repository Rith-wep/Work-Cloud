name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        run: npm ci --prefix client

      - name: Run client tests
        run: npm run test:client

      - name: Build client
        run: npm run build

  api:
    name: API checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install API dependencies
        run: npm ci --prefix server

      - name: Run API tests
        run: npm run test:api

  ai:
    name: AI service checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install AI dependencies
        run: python -m pip install -r ai-service/requirements.txt

      - name: Compile AI service
        run: python -m compileall -q ai-service/app

      - name: Run AI tests when present
        run: |
          if [ -d ai-service/tests ] && find ai-service/tests -type f -name 'test_*.py' -print -quit | grep -q .; then
            python -m pip install pytest
            python -m pytest ai-service/tests
          else
            echo "No AI test modules found; Python compilation passed."
          fi

  docker:
    name: Build container images
    runs-on: ubuntu-latest
    needs: [client, api, ai]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/client.Dockerfile
          push: false
          tags: workcloud-web:ci

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/api.Dockerfile
          push: false
          tags: workcloud-api:ci

      - name: Build AI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ops/docker/ai.Dockerfile
          push: false
          tags: workcloud-ai:ci
